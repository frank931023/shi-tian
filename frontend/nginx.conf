server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback:React Router 的前端路由(例如 /orders)在重新整理時,
    # nginx 找不到實體檔案,要回 index.html 交給前端路由處理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源快取(檔名有 hash,可長快取)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
