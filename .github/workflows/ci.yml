# GitHub Actions CI:每次 push / PR 自動驗證。
# 三個工作平行跑:後端煙霧測試、前端建置、Docker 映像建置。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: 後端煙霧測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安裝相依
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Phase 1 煙霧測試(SQLite)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///ci1.db"
          SECRET_KEY: ci-test
          PYTHONPATH: .
        run: python tests/smoke_phase1.py
      - name: Phase 2 煙霧測試(認證/權限/CSRF/rate limit)
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///ci2.db"
          SECRET_KEY: ci-test
          SESSION_COOKIE_SECURE: "false"
          PYTHONPATH: .
        run: python tests/smoke_phase2.py

  frontend-build:
    name: 前端建置(型別檢查 + Vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安裝相依
        working-directory: frontend
        run: npm ci
      - name: 建置(tsc --noEmit && vite build)
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker 映像建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build backend image
        run: docker build -t shitian-backend ./backend
      - name: build frontend image
        run: docker build -t shitian-frontend ./frontend
