# GitHub Actions CD:把 backend / frontend 映像建好並推到 GHCR。
# 依分支自動分環境標籤:
#   main    → :prod 、:prod-<sha> 、:latest   (正式 NAS 拉這個)
#   develop → :dev  、:dev-<sha>             (dev 機器拉這個)
#
# 目前只做到「build + push」;NAS / dev 機器端自行 `docker compose pull && up -d`
# (做法見 docs/部署與維運.md「CD / 映像更新」一節)。
#
# 推到 GHCR 用內建的 GITHUB_TOKEN,不必另設密碼;只要下面 permissions 開 packages: write。
name: CD

on:
  push:
    branches: [main, develop]
  # 也允許手動觸發(Actions 頁面按 Run workflow)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: frank931023

jobs:
  build-push:
    name: build & push (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: 產生映像標籤(依分支決定 dev / prod)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/shitian-${{ matrix.component }}
          tags: |
            type=raw,value=prod,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev,enable=${{ github.ref_name == 'develop' }}
            type=sha,format=short,prefix=prod-,enable=${{ github.ref_name == 'main' }}
            type=sha,format=short,prefix=dev-,enable=${{ github.ref_name == 'develop' }}

      - uses: docker/setup-buildx-action@v3

      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
