# ============================================================
# 基底 compose(dev / prod 共用)
#   proxy(Caddy)→ frontend(nginx+React)/ backend(Flask+gunicorn)
#   backend → db(PostgreSQL) + redis(rate limit 儲存)
#
# 對外只有 proxy 開埠;frontend / backend / db / redis 都只在內部網路。
#
# 用法:
#   開發(容器):  docker compose up -d                       # 自動套 override(dev)
#   正式:        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (或用 scripts/dev-up.sh、scripts/prod-up.sh)
# ============================================================

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # 開發掛專案內 ./pgdata;正式在 prod compose 改成 NAS 實體路徑
      - ./pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    # 用途:Flask-Limiter 的 rate limit 計數共用儲存(多 worker 才精準);
    # 未來也可拿來做快取 / session 共享。資料可揮發,不需備份。
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

volumes:
  caddy_data:
  caddy_config:
