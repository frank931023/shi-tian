# ============================================================
# 開發覆蓋設定(docker compose 會自動合併;dev 用)。
# 把 db / backend 對本機開埠,方便開發時直連測試。
#
# ⚠ 正式環境不要套用本檔(用 prod compose):
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:
  db:
    # 本機 5432 常被佔用,對外用 5433(容器內仍 5432)
    ports:
      - "5433:5432"

  backend:
    # 開發時直接打 http://localhost:8000/api/...(免經 Caddy)
    ports:
      - "8000:8000"
